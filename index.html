<style>@font-face{font-family:"nanumBarunPen";font-weight:400;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/wefonts/nanumBarunPen/nanumBarunPen-Regular.woff2") format("woff2")}</style>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f6f4ee;--paper:#fffefa;--ink:#30352f;--muted:#858b82;--green:#58715f;--line:#b9c5b7;--sage:#dfe8dc;--blue:#dfe7ee;--rose:#eee0df;--gold:#eee7cf;--lav:#e9e5ef}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg)}
button,input{font:inherit} button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}
header{height:62px;flex:0 0 62px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #e4e0d7;background:rgba(255,254,250,.97);z-index:5}
.brand{font-family:Georgia,serif;font-size:20px;letter-spacing:.04em;white-space:nowrap}.version{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:11px;font-weight:600;letter-spacing:0;color:#7f877f;background:#efeee9;border-radius:999px;padding:3px 7px;vertical-align:middle;margin-left:4px}
.head{display:flex;gap:7px;align-items:center}.head button{border:1px solid #ddd8ce;background:#fff;border-radius:11px;padding:8px 10px;color:#545b53}
.workspace{position:relative;flex:1;overflow:hidden;touch-action:none;background-image:radial-gradient(#dcd9d0 1px,transparent 1px);background-size:24px 24px}
.stage{position:absolute;left:0;top:0;width:2400px;height:1600px;transform-origin:0 0}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
path{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}
.node{position:absolute;width:170px;min-height:54px;padding:12px 13px;border-radius:17px;background:#fff;border:1px solid #ddd8cf;box-shadow:0 5px 15px rgba(50,55,48,.08);text-align:center;user-select:none;touch-action:none}
.node.root{background:var(--green);color:white;font-weight:700;width:200px}
.node.selected{outline:3px solid rgba(88,113,95,.22);border-color:var(--green)}
.node .emoji{font-size:24px;line-height:1.1;margin-bottom:4px}
.node img{display:block;width:100%;aspect-ratio:1/1;height:auto;object-fit:cover;border-radius:11px;margin:0 0 7px}
.node .credit{font-size:9px;color:#7f857d;margin-top:5px;line-height:1.25}.node.root .credit{color:#dce5df}
.node .label{word-break:break-word}
.tip{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.9);border:1px solid #e3dfd5;border-radius:11px;padding:8px 10px;color:#777;font-size:11px;pointer-events:none}
.toolbar{position:absolute;cursor:grab;left:50%;top:90px;display:flex;gap:3px;padding:6px;background:rgba(255,255,255,.97);border:1px solid #dedad0;border-radius:16px;box-shadow:0 7px 22px rgba(50,50,45,.14);z-index:8;transform:translateX(-50%);max-width:calc(100% - 24px);overflow-x:auto}
.toolbar.dragging{cursor:grabbing}.toolbar.context-hidden{display:none}.toolbar button{border:0;background:transparent;border-radius:10px;padding:9px 10px;color:#555d55;white-space:nowrap}.toolbar button:active{background:#eee}
.fab{position:absolute;right:15px;bottom:76px;width:54px;height:54px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:28px;box-shadow:0 7px 20px rgba(50,70,55,.25);z-index:4}
.sheet{display:none;position:absolute;z-index:20;left:50%;bottom:0;width:min(560px,100%);height:auto;max-height:min(68vh,560px);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translate(-50%,105%);transition:.2s;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 36px rgba(0,0,0,.14)}
.sheet.open{display:block;transform:translate(-50%,0)}
.sheet h3{margin:0 38px 13px 0;font-size:17px}.compact-sheet{padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));max-height:none}.compact-sheet h3{margin-bottom:8px}.compact-sheet .textin{padding:10px 12px}.sheet-close{position:sticky;float:right;top:0;z-index:3;width:34px;height:34px;margin:-5px -3px 0 8px;border:0;border-radius:50%;background:#f0eee9;font-size:20px;color:#555}.row{display:flex;gap:8px}.textin,.search{width:100%;border:1px solid #ddd8ce;border-radius:12px;padding:12px;outline:none}.textin:focus,.search:focus{border-color:#8fa28e}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.actions button,.widebtn{border:0;border-radius:11px;padding:10px 14px}.cancel{background:#eee}.primary{background:var(--green);color:#fff}
.emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.emoji-grid button{border:0;background:#f5f4f0;border-radius:10px;font-size:23px;padding:8px 2px}
.tabs{display:flex;gap:7px;margin-bottom:12px}.tabs button{flex:1;border:1px solid #ddd8ce;background:#faf9f6;border-radius:11px;padding:9px}.tabs button.active{background:#eaf0e8;border-color:#bdcbb9}
.preview{margin-top:12px;border:1px dashed #d5d1c7;border-radius:14px;padding:12px;text-align:center;color:#858b82;font-size:12px}.preview img{max-width:100%;max-height:180px;border-radius:12px}
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid #eeeae2;margin-top:10px}.switch{width:46px;height:27px;border-radius:20px;background:#ccc;position:relative;border:0}.switch:after{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s}.switch.on{background:var(--green)}.switch.on:after{left:22px}
.menu{position:absolute;top:68px;right:12px;z-index:15;background:#fff;border:1px solid #ddd9cf;border-radius:14px;padding:7px;box-shadow:0 8px 25px rgba(0,0,0,.12);display:none}.menu.open{display:block}.menu button{display:block;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:9px}.menu button:active{background:#eee}
.emoji-pages{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap;margin:12px 0 4px}.emoji-pages button{min-width:34px;height:34px;border:1px solid #ddd8ce;border-radius:9px;background:#faf9f6;color:#555}.emoji-pages button.active{background:var(--green);color:#fff;border-color:var(--green)}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:10px 0}.swatch{height:42px;border:2px solid transparent;border-radius:12px}.swatch.active{border-color:#4f5f52;outline:2px solid #d8ded7}.sectionlabel{font-size:12px;color:#777;margin:12px 0 6px}.recent-images{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.recent-images button{flex:0 0 78px;height:62px;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:#eee}.recent-images img{width:100%;height:100%;object-fit:cover}.hidden{display:none!important}
@media(max-width:600px){.brand{font-size:18px}.head .hide-sm{display:none}.toolbar{width:calc(100% - 24px);justify-content:space-around}.toolbar button{font-size:12px;padding:9px 6px}.emoji-grid{grid-template-columns:repeat(7,1fr)}}
.toolbar button,.fab,header,header button,.sheet,.sheet button,.sheet input,.menu,.menu button{touch-action:manipulation}.toolbar{touch-action:none}

#textSheet{position:absolute;left:50%;top:88px;bottom:auto;width:min(390px,calc(100% - 28px));transform:translateX(-50%);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.16);overflow:visible}#textSheet h3,#textSheet .sheet-close{display:none}.font-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.font-grid button,.size-row button{border:1px solid #ddd8ce;background:#faf9f6;border-radius:11px;padding:10px 6px;min-height:44px;font-size:13px}.font-grid button.active,.size-row button.active{background:#eaf0e8;border-color:#8fa28e}.size-row{display:flex;gap:7px;flex-wrap:wrap}.size-row button{flex:1}.node .label{line-height:1.35}
.zoom-controls{position:absolute;right:14px;top:14px;z-index:7;display:flex;align-items:center;background:rgba(255,255,255,.96);border:1px solid #dedad0;border-radius:13px;box-shadow:0 5px 16px rgba(50,50,45,.1);overflow:hidden}.zoom-controls button{border:0;background:transparent;min-width:42px;height:40px;padding:0 8px;color:#555;font-weight:700}.zoom-controls #zoomLabel{min-width:58px;font-size:12px;font-weight:600;border-left:1px solid #eee9df;border-right:1px solid #eee9df}.zoom-controls button:active{background:#eee}

.collapsed-badge{position:absolute;right:-8px;top:-8px;background:#58715f;color:#fff;border-radius:999px;font-size:10px;padding:3px 6px;border:2px solid #fff}.root-lines{display:grid;gap:8px;margin-top:8px}.root-line-row{display:grid;grid-template-columns:1fr 54px;gap:8px;align-items:center;padding:8px 10px;border:1px solid #e7e2d8;border-radius:11px}.root-line-row input{width:48px;height:32px;border:0;background:none;padding:0}.toolbar .mini-action{font-weight:700}.lock-on{background:#e8eee6!important;color:#405645!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">
<header>
 <div class="brand">생각가지 <span class="version">v2.4</span></div>
 <div class="head">
  <button id="newMap">새 맵</button>
  <button class="hide-sm" id="centerBtn">가운데로</button>
  <button id="moreBtn">⋯</button>
 </div>
</header>
<div class="workspace" id="ws">
 <div class="stage" id="stage"><svg id="lines"></svg></div>
 <div class="tip">+ → 새 가지 · 노드 선택 → 수정/이모지/이미지 · 빈 곳 드래그 → 이동 · 두 손가락 → 확대/축소</div>
 <div class="zoom-controls"><button id="zoomOut" aria-label="축소">−</button><button id="zoomLabel">100%</button><button id="zoomIn" aria-label="확대">＋</button></div>
 <div class="toolbar context-hidden" id="toolbar">
  <button id="undoBtn" class="mini-action" title="실행취소">↶</button><button id="redoBtn" class="mini-action" title="다시실행">↷</button><button id="addChild">＋ 가지</button><button id="addSibling">＋ 형제</button>
  <button id="editNode">✎ 수정</button><button id="fontBtn">Aa 글자</button><button id="colorBtn">● 색상</button><button id="emojiBtn">☺ 이모지</button><button id="imageBtn">▧ 이미지</button><button id="collapseBtn">− 접기</button><button id="duplicateBtn">⧉ 복제</button>
 </div>
 <button class="fab" id="fab">＋</button>
</div>
<div class="menu" id="menu">
 <button id="toggleCredits">이미지 출처 숨기기</button>
 <button id="fitBtn">전체 보기</button>
 <button id="autoArrangeBtn">자동정렬</button>
 <button id="lockBtn">🔓 위치 잠금</button>
 <button id="pngBtn">PNG로 내보내기</button>
 <button id="pdfBtn">PDF로 내보내기</button>
 <button id="deleteBtn">선택 노드 삭제</button>
 <button id="saveMapBtn">마인드맵 파일 저장</button>
 <button id="openMapBtn">마인드맵 파일 열기</button>
 <button id="exportBtn">백업 저장</button>
 <button id="importBtn">백업 불러오기</button>
</div>

<div class="sheet compact-sheet" id="textSheet">
 <button class="sheet-close" data-close aria-label="닫기">×</button>
 <h3 id="textTitle">가지 추가</h3>
 <input class="textin" id="textInput" placeholder="입력 후 Enter">
</div>


<div class="sheet" id="colorSheet">
 <button class="sheet-close" data-close aria-label="닫기">×</button>
 <h3>가지 색상</h3>
 <div class="sectionlabel">노드 색상</div><div class="palette" id="colorPalette"></div>
 <div class="sectionlabel">연결선 색상</div><div class="palette" id="linePalette"></div><div id="rootLineWrap" class="hidden"><div class="sectionlabel">중앙 노드에서 나가는 선 개별 색상</div><div class="root-lines" id="rootLineEditor"></div></div>
 <label style="display:flex;align-items:center;gap:9px;margin-top:12px"><input type="checkbox" id="applyDesc" checked> 이 가지 아래의 하위 가지에도 적용</label>
 <div class="actions"><button class="cancel" data-close>취소</button><button class="primary" id="colorSave">적용</button></div>
</div>

<div class="sheet" id="fontSheet"><button class="sheet-close" data-close aria-label="닫기">×</button><h3>글자 설정</h3><div class="sectionlabel">폰트</div><div class="font-grid" id="fontGrid"></div><div class="sectionlabel">글자 크기</div><div class="size-row" id="sizeRow"></div><label style="display:flex;align-items:center;gap:9px;margin-top:14px"><input type="checkbox" id="fontDesc"> 하위 가지에도 적용</label><div class="actions"><button class="cancel" data-close>취소</button><button class="primary" id="fontSave">적용</button></div></div>
<div class="sheet" id="emojiSheet">
 <button class="sheet-close" data-close aria-label="닫기">×</button>
 <h3>이모지 선택</h3>
 <input class="search" id="emojiSearch" placeholder="검색: 책, 생각, 질문, 글쓰기…">
 <div class="sectionlabel" id="recentEmojiLabel">최근 사용</div><div class="emoji-grid" id="recentEmojiGrid"></div><div class="sectionlabel">전체 이모지</div><div class="emoji-grid" id="emojiGrid"></div><div class="emoji-pages" id="emojiPages"></div>
 <div class="actions"><button class="cancel" id="removeEmoji">이모지 제거</button><button class="cancel" data-close>닫기</button></div>
</div>

<div class="sheet" id="imageSheet">
 <button class="sheet-close" data-close aria-label="닫기">×</button>
 <h3>이미지</h3>
 <div class="tabs"><button class="active">내 이미지</button><button id="onlineTab">이미지 검색</button></div>
 <input type="file" id="fileInput" accept="image/*" class="hidden">
 <button class="widebtn primary" id="chooseImage">사진 보관함에서 선택</button><div class="sectionlabel" id="recentImageLabel">최근 사용 이미지</div><div class="recent-images" id="recentImages"></div>
 <div class="preview" id="imgPreview">오프라인 버전에서는 내 사진을 바로 넣을 수 있어요.<br>상업용 이미지 검색은 온라인 버전에서 Pixabay 연동 예정.</div>
 <input class="textin" id="creditInput" placeholder="출처 메모 (선택)" style="margin-top:10px">
 <div class="switchrow"><span>이 이미지의 출처 표시</span><button class="switch on" id="creditSwitch"></button></div>
 <div class="actions"><button class="cancel" id="removeImage">이미지 제거</button><button class="cancel" data-close>취소</button><button class="primary" id="imageSave">적용</button></div>
</div>
<input type="file" id="backupInput" accept=".json,application/json" class="hidden"><input type="file" id="mapInput" accept=".json,.mindmap.json,application/json" class="hidden">
<script>
const KEY='saenggakgaji-offline-v1', RECENT_KEY='saenggakgaji-recents-v1', COLORS=['#dfe8dc','#dfe7ee','#eee0df','#eee7cf','#e9e5ef'], PALETTE=['#dfe8dc','#dfe7ee','#eee0df','#eee7cf','#e9e5ef','#dce9e7','#f0ddd1','#e2e2e2','#cfe0d2','#d8d2e8','#f1d6dc','#d8e3f0'];
let data, selectedId='root', textMode='child', scale=1, tx=0, ty=0, drag=false, px=0,py=0, pendingImage=null, showCredits=true, pendingColor=COLORS[0], pendingLineColor='#b9c5b7', toolbarManual=false, positionLocked=false;
let undoStack=[],redoStack=[],historyBusy=false,lastSnapshot='';
let recents=(()=>{try{return JSON.parse(localStorage.getItem(RECENT_KEY))||{emojis:[],images:[]}}catch(e){return {emojis:[],images:[]}}})();
function saveRecents(){try{localStorage.setItem(RECENT_KEY,JSON.stringify(recents))}catch(e){}}
const $=id=>document.getElementById(id), stage=$('stage'),ws=$('ws');

function fresh(){return {nodes:[
{id:'root',parent:null,text:'나의 생각',x:1100,y:760,color:'#58715f',root:true,emoji:'🌿',image:null,credit:'',showCredit:true},
{id:'a',parent:'root',text:'첫 번째 가지',x:1450,y:560,color:COLORS[0],emoji:'💡',image:null,credit:'',showCredit:true},
{id:'b',parent:'root',text:'두 번째 가지',x:1450,y:800,color:COLORS[1],emoji:'',image:null,credit:'',showCredit:true},
{id:'c',parent:'root',text:'세 번째 가지',x:760,y:610,color:COLORS[2],emoji:'❓',image:null,credit:'',showCredit:true}
],showCredits:true}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}}
function save(){data.showCredits=showCredits;data.positionLocked=positionLocked;let snap=JSON.stringify(data);if(!historyBusy&&snap!==lastSnapshot){undoStack.push(snap);if(undoStack.length>60)undoStack.shift();redoStack=[];lastSnapshot=snap}try{localStorage.setItem(KEY,snap)}catch(e){alert('이미지가 너무 커서 저장 공간이 부족할 수 있어요. 더 작은 이미지를 사용해 주세요.')}updateHistoryButtons()}
data=load();showCredits=data.showCredits!==false;positionLocked=!!data.positionLocked;lastSnapshot=JSON.stringify(data);undoStack=[lastSnapshot];

function node(id){return data.nodes.find(n=>n.id===id)}
function children(id){return data.nodes.filter(n=>n.parent===id)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function contrastText(c,isRoot=false){let m=String(c||'').match(/\d+/g);if(m&&m.length>=3){let y=(+m[0]*299 + +m[1]*587 + +m[2]*114)/1000;return y<145?'#fff':'#30352f'}return isRoot?'#fff':'#30352f'}
function hiddenIds(){let set=new Set();data.nodes.filter(n=>n.collapsed).forEach(n=>descendants(n.id).forEach(x=>set.add(x.id)));return set}
function render(){
 const hidden=hiddenIds();
 stage.querySelectorAll('.node').forEach(n=>n.remove());
 data.nodes.forEach(n=>{
  if(hidden.has(n.id))return;
  const el=document.createElement('div');el.className='node'+(n.root?' root':'')+(n.id===selectedId?' selected':'');
  el.dataset.id=n.id;el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.background=n.color||(n.root?'#58715f':'#fff');el.style.color=contrastText(el.style.backgroundColor,n.root);el.style.fontFamily=n.fontFamily||'inherit';el.style.fontSize=(n.fontSize||defaultFontSize(n.id))+'px';
  el.innerHTML=(n.image?`<img src="${n.image}">`:'')+(n.emoji?`<div class="emoji">${esc(n.emoji)}</div>`:'')+
   `<div class="label">${esc(n.text)}</div>`+
   (n.image&&n.credit&&showCredits&&n.showCredit!==false?`<div class="credit">${esc(n.credit)}</div>`:'')+(n.collapsed&&children(n.id).length?`<span class="collapsed-badge">+${descendants(n.id).length}</span>`:'');
  el.addEventListener('click',e=>{e.stopPropagation();selectedId=n.id;toolbarManual=false;render()});bindTouchNode(el);
  el.addEventListener('dblclick',e=>{e.stopPropagation();selectedId=n.id;openText('edit')});
  stage.appendChild(el)
 });
 drawLines();
 const sn=node(selectedId);
 $('toolbar').classList.toggle('context-hidden', !sn);
 $('addSibling').style.display=sn&&sn.root?'none':'';
 $('colorBtn').style.display='';$('collapseBtn').style.display=sn&&children(sn.id).length?'':'none';$('collapseBtn').textContent=sn&&sn.collapsed?'＋ 펼치기':'− 접기';$('lockBtn').textContent=positionLocked?'🔒 위치 잠금 해제':'🔓 위치 잠금';$('lockBtn').classList.toggle('lock-on',positionLocked);
 $('toggleCredits').textContent=showCredits?'이미지 출처 숨기기':'이미지 출처 보이기';positionToolbar();
}

function depthOf(id){let d=0,n=node(id);while(n&&n.parent){d++;n=node(n.parent)}return d}
function defaultFontSize(id){let d=depthOf(id);return d===0?22:d===1?18:d===2?16:14}
function positionToolbar(force=false){let n=node(selectedId),tb=$('toolbar');if(!n||(!force&&toolbarManual))return;requestAnimationFrame(()=>{let el=stage.querySelector('.node[data-id="'+CSS.escape(n.id)+'"]');if(!el)return;let r=el.getBoundingClientRect(),wr=ws.getBoundingClientRect(),tw=tb.offsetWidth||520,th=tb.offsetHeight||52,gap=18;let x=r.left-wr.left+r.width/2,y=r.bottom-wr.top+gap;if(y+th>ws.clientHeight-12)y=Math.max(12,r.top-wr.top-th-gap);x=Math.max(tw/2+12,Math.min(ws.clientWidth-tw/2-12,x));tb.style.left=x+'px';tb.style.top=y+'px'})}
function drawLines(){
 let s='',hidden=hiddenIds();data.nodes.filter(n=>n.parent&&!hidden.has(n.id)).forEach(n=>{let p=node(n.parent);if(!p)return;
 let pe=stage.querySelector('.node[data-id="'+CSS.escape(p.id)+'"]'),ne=stage.querySelector('.node[data-id="'+CSS.escape(n.id)+'"]');let pw=pe?pe.offsetWidth:(p.root?200:170),ph=pe?pe.offsetHeight:70,nw=ne?ne.offsetWidth:(n.root?200:170),nh=ne?ne.offsetHeight:70;
 let x1=p.x+pw/2,y1=p.y+ph/2,x2=n.x+nw/2,y2=n.y+nh/2,mid=(x1+x2)/2;
 let stroke=n.lineColor||n.branchColor||'#b9c5b7';s+=`<path d="M${x1} ${y1} C${mid} ${y1},${mid} ${y2},${x2} ${y2}" style="stroke:${stroke}"/>`});$('lines').innerHTML=s
}

function bindTouchNode(el){
 let startX=0,startY=0,baseX=0,baseY=0,moving=false,id=el.dataset.id;
 el.addEventListener('touchstart',function(e){
   if(e.touches.length!==1)return;
   const n=node(id); if(!n||positionLocked)return;
   selectedId=id; startX=e.touches[0].clientX; startY=e.touches[0].clientY;
   baseX=n.x;baseY=n.y;moving=false;
 },{passive:true});
 el.addEventListener('touchmove',function(e){
   if(e.touches.length!==1||positionLocked)return;
   const dx=(e.touches[0].clientX-startX)/scale,dy=(e.touches[0].clientY-startY)/scale;
   if(Math.abs(dx)+Math.abs(dy)>8){
     moving=true;e.preventDefault();
     const n=node(id);n.x=baseX+dx;n.y=baseY+dy;render();
   }
 },{passive:false});
 el.addEventListener('touchend',function(){if(moving)save()},{passive:true});
}
function apply(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;let z=$('zoomLabel');if(z)z.textContent=Math.round(scale*100)+'%'}
function setZoom(next,cx=ws.clientWidth/2,cy=ws.clientHeight/2){let old=scale;next=Math.max(.25,Math.min(2.2,next));if(Math.abs(next-old)<.001)return;let wx=(cx-tx)/old,wy=(cy-ty)/old;scale=next;tx=cx-wx*scale;ty=cy-wy*scale;apply()}
function center(){scale=Math.min(.9,Math.max(.42,ws.clientWidth/1200));let r=node('root')||data.nodes[0];tx=ws.clientWidth/2-(r.x+100)*scale;ty=ws.clientHeight/2-(r.y+40)*scale;apply()}
setTimeout(center,30);addEventListener('resize',center);
function isCanvasBlankTarget(t){return t===ws||t===stage||t===$('lines')}
ws.addEventListener('pointerdown',e=>{
 if(!isCanvasBlankTarget(e.target)||e.button!==0)return;
 drag=true;px=e.clientX-tx;py=e.clientY-ty;
 try{ws.setPointerCapture(e.pointerId)}catch(_){}
});
ws.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();tx=e.clientX-px;ty=e.clientY-py;apply()});
function stopPan(e){drag=false;try{ws.releasePointerCapture(e.pointerId)}catch(_){}}
ws.addEventListener('pointerup',stopPan);ws.addEventListener('pointercancel',stopPan);
ws.addEventListener('wheel',e=>{e.preventDefault();setZoom(scale*(e.deltaY>0?.9:1.1),e.clientX,e.clientY)},{passive:false});
$('zoomIn').onclick=()=>setZoom(scale*1.15);$('zoomOut').onclick=()=>setZoom(scale/1.15);$('zoomLabel').onclick=()=>center();
let pinch=null;ws.addEventListener('touchstart',e=>{if(e.touches.length===2){let a=e.touches[0],b=e.touches[1];pinch={dist:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),scale,cx:(a.clientX+b.clientX)/2,cy:(a.clientY+b.clientY)/2,tx,ty};drag=false}}, {passive:true});
ws.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){e.preventDefault();let a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;let old=scale,newScale=Math.max(.25,Math.min(2.2,pinch.scale*d/pinch.dist));let wx=(pinch.cx-pinch.tx)/pinch.scale,wy=(pinch.cy-pinch.ty)/pinch.scale;scale=newScale;tx=cx-wx*scale;ty=cy-wy*scale;apply()}},{passive:false});
ws.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null},{passive:true});

function openSheet(id){closeSheets();const target=$(id);if(target){target.classList.add('open')}}
function closeSheets(){document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('open'));if(!$('toolbar').classList.contains('context-hidden')){toolbarManual=false;positionToolbar(true)}}

function openText(mode){$('imageSheet').classList.remove('open');textMode=mode;let n=node(selectedId);$('textTitle').textContent=mode==='edit'?'노드 수정':mode==='sibling'?'형제 가지 추가':'하위 가지 추가';$('textInput').value=mode==='edit'&&n?n.text:'';openSheet('textSheet');positionTextSheet();setTimeout(()=>$('textInput').focus(),80)}
function positionTextSheet(){let n=node(selectedId),sh=$('textSheet');if(!n)return;requestAnimationFrame(()=>{let el=stage.querySelector('.node[data-id="'+CSS.escape(n.id)+'"]');if(!el)return;let r=el.getBoundingClientRect(),wr=ws.getBoundingClientRect(),x=r.left-wr.left+r.width/2,y=r.bottom-wr.top+16;x=Math.max(210,Math.min(ws.clientWidth-210,x));if(y+70>ws.clientHeight)y=Math.max(12,r.top-wr.top-70);sh.style.left=x+'px';sh.style.top=y+'px';let tb=$('toolbar');tb.classList.remove('context-hidden');toolbarManual=false;requestAnimationFrame(()=>{let sr=sh.getBoundingClientRect(),tw=tb.offsetWidth||520,th=tb.offsetHeight||52,txx=sr.left-wr.left+sr.width/2,tyy=sr.bottom-wr.top+14;if(tyy+th>ws.clientHeight-10)tyy=Math.max(10,sr.top-wr.top-th-14);txx=Math.max(tw/2+12,Math.min(ws.clientWidth-tw/2-12,txx));tb.style.left=txx+'px';tb.style.top=tyy+'px'})})}

function commitText(){
 let t=$('textInput').value.trim();if(!t)return;let cur=node(selectedId);if(!cur)return;if(textMode==='edit'){cur.text=t}
 else{let parent=textMode==='sibling'?(cur.parent||cur.id):cur.id;let p=node(parent),kids=children(parent);let id='n'+Date.now();
 let side=p.x<1100?-1:1;if(p.root)side=(kids.length%2===0?1:-1);
 let x=p.x+side*300,y=p.y+(kids.length-Math.floor(kids.length/2))*115;
 data.nodes.push({id,parent,text:t,x,y,color:COLORS[kids.length%COLORS.length],emoji:'',image:null,credit:'',showCredit:true});selectedId=id;autoArrange(false)}
 save();render();closeSheets()
}
$('textInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commitText()}else if(e.key==='Escape')closeSheets()});

function descendants(id){let out=[],q=[id];while(q.length){let a=q.shift();children(a).forEach(c=>{out.push(c);q.push(c.id)})}return out}
function bindPalette(id,key){let box=$(id),val=key==='node'?pendingColor:pendingLineColor;box.innerHTML=PALETTE.map(c=>`<button type="button" class="swatch${c===val?' active':''}" data-c="${c}" style="background:${c}" aria-label="색상 ${c}"></button>`).join('');box.querySelectorAll('button').forEach(b=>{let pick=e=>{e.preventDefault();e.stopPropagation();if(key==='node')pendingColor=b.dataset.c;else pendingLineColor=b.dataset.c;renderPalettes()};b.addEventListener('pointerup',pick)})}
function renderPalettes(){bindPalette('colorPalette','node');bindPalette('linePalette','line')}
$('colorBtn').onclick=()=>{let n=node(selectedId);if(!n)return;pendingColor=n.color||(n.root?'#58715f':COLORS[0]);pendingLineColor=n.lineColor||n.branchColor||'#b9c5b7';renderPalettes();let wrap=$('rootLineWrap'),ed=$('rootLineEditor');wrap.classList.toggle('hidden',!n.root);if(n.root){ed.innerHTML=children(n.id).map(c=>`<label class="root-line-row"><span>${esc(c.text)}</span><input type="color" data-line-id="${esc(c.id)}" value="${c.lineColor||'#b9c5b7'}"></label>`).join('')}openSheet('colorSheet')};
$('colorSave').onclick=()=>{let n=node(selectedId);if(!n)return;let desc=$('applyDesc').checked?descendants(n.id):[];n.color=pendingColor;if(n.root){$('rootLineEditor').querySelectorAll('input[data-line-id]').forEach(i=>{let c=node(i.dataset.lineId);if(c)c.lineColor=i.value});if($('applyDesc').checked)desc.forEach(x=>x.color=pendingColor)}else{n.lineColor=pendingLineColor;if($('applyDesc').checked)desc.forEach(x=>{x.color=pendingColor;x.lineColor=pendingLineColor})}save();render();closeSheets()};
function autoArrange(doCenter=true){let root=node('root');if(!root)return;root.x=1100;root.y=760;let first=children(root.id),left=[],right=[];first.forEach((n,i)=>(i%2?left:right).push(n));const h=n=>n.image?(n.root?270:240):Math.max(82,58+(String(n.text||'').length>18?28:0));function span(n){let ks=children(n.id);if(!ks.length)return h(n)+42;return Math.max(h(n)+42,ks.reduce((a,c)=>a+span(c),0))}function layoutChildren(p,side){let ks=children(p.id);if(!ks.length)return;let total=ks.reduce((a,c)=>a+span(c),0),cursor=p.y-total/2;ks.forEach(c=>{let sp=span(c);c.x=p.x+side*300;c.y=cursor+sp/2-h(c)/2;cursor+=sp;layoutChildren(c,side)})}function group(g,side){let total=g.reduce((a,c)=>a+span(c),0),cursor=root.y-total/2;g.forEach(c=>{let sp=span(c);c.x=root.x+side*380;c.y=cursor+sp/2-h(c)/2;cursor+=sp;layoutChildren(c,side)})}group(right,1);group(left,-1);save();render();if(doCenter)center()}

function keywordEmoji(z){let hits=[];Object.entries(emojiKeywords).forEach(([k,v])=>{if(k.includes(z)||z.includes(k))Array.from(v).forEach(e=>{if(!hits.includes(e))hits.push(e)})});return hits}
function renderEmoji(q=''){
 let z=q.trim().toLowerCase(), all=z?keywordEmoji(z):emojiData, pages=Math.max(1,Math.ceil(all.length/EMOJI_PAGE_SIZE));emojiPage=Math.min(Math.max(1,emojiPage),pages);
 let shown=all.slice((emojiPage-1)*EMOJI_PAGE_SIZE,emojiPage*EMOJI_PAGE_SIZE);
 $('emojiGrid').innerHTML=shown.map(e=>`<button data-e="${e}">${e}</button>`).join('')||'<div style="grid-column:1/-1;color:#888;padding:12px">검색 결과가 없어요.</div>';
 $('recentEmojiLabel').style.display=z?'none':'block';$('recentEmojiGrid').style.display=z?'none':'grid';$('recentEmojiGrid').innerHTML=recents.emojis.slice(0,14).map(e=>`<button data-e="${e}">${e}</button>`).join('')||'<span style="grid-column:1/-1;color:#999;font-size:12px">아직 없어요.</span>';
 let nav='';if(pages>1){nav+='<button data-p="prev">‹</button>';let start=Math.max(1,emojiPage-2),end=Math.min(pages,start+4);start=Math.max(1,end-4);if(start>1)nav+='<span>…</span>';for(let i=start;i<=end;i++)nav+=`<button data-p="${i}" class="${i===emojiPage?'active':''}">${i}</button>`;if(end<pages)nav+='<span>…</span>';nav+='<button data-p="next">›</button>'}$('emojiPages').innerHTML=nav;
 [...$('emojiGrid').querySelectorAll('button'),...$('recentEmojiGrid').querySelectorAll('button')].forEach(b=>b.onclick=()=>chooseEmoji(b.dataset.e));
 $('emojiPages').querySelectorAll('button').forEach(b=>b.onclick=()=>{let p=b.dataset.p;emojiPage=p==='prev'?Math.max(1,emojiPage-1):p==='next'?Math.min(pages,emojiPage+1):+p;renderEmoji(q)})
}

$('fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let max=1200,ratio=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);c.getContext('2d').drawImage(im,0,0,c.width,c.height);pendingImage=c.toDataURL('image/jpeg',.78);recents.images=[pendingImage,...recents.images.filter(x=>x!==pendingImage)].slice(0,8);saveRecents();renderRecentImages();$('imgPreview').innerHTML=`<img src="${pendingImage}">`};im.src=r.result};r.readAsDataURL(f)};

$('undoBtn').onclick=()=>{if(undoStack.length<=1)return;let cur=undoStack.pop();redoStack.push(cur);restoreSnapshot(undoStack[undoStack.length-1])};
$('redoBtn').onclick=()=>{if(!redoStack.length)return;let snap=redoStack.pop();undoStack.push(snap);restoreSnapshot(snap)};
$('collapseBtn').onclick=()=>{let n=node(selectedId);if(!n||!children(n.id).length)return;n.collapsed=!n.collapsed;save();render()};
$('duplicateBtn').onclick=()=>{let src=node(selectedId);if(!src)return;if(src.root){alert('중심 노드는 복제하지 않아요.');return}let originals=[src,...descendants(src.id)],map={};originals.forEach((o,i)=>map[o.id]='n'+Date.now()+'_'+i);originals.forEach(o=>{let c=JSON.parse(JSON.stringify(o));c.id=map[o.id];c.parent=o.id===src.id?src.parent:map[o.parent];c.x=o.x+45;c.y=o.y+55;c.root=false;data.nodes.push(c)});selectedId=map[src.id];save();render()};

function visibleNodes(){let h=hiddenIds();return data.nodes.filter(n=>!h.has(n.id))}
async function exportCanvas(){if(typeof html2canvas==='undefined'){alert('내보내기 모듈을 불러오지 못했어요. 인터넷 연결 후 다시 시도해 주세요.');return null}closeSheets();$('toolbar').classList.add('context-hidden');let ns=visibleNodes();let minX=Math.min(...ns.map(n=>n.x))-60,minY=Math.min(...ns.map(n=>n.y))-60,maxX=Math.max(...ns.map(n=>n.x+220))+60,maxY=Math.max(...ns.map(n=>n.y+(n.image?300:120)))+60;let old=stage.style.transform;stage.style.transform='none';let canvas=await html2canvas(stage,{backgroundColor:'#f6f4ee',x:minX,y:minY,width:maxX-minX,height:maxY-minY,scale:2,useCORS:true});stage.style.transform=old;render();return canvas}
$('pngBtn').onclick=async()=>{ $('menu').classList.remove('open');let c=await exportCanvas();if(!c)return;c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(node('root')?.text||'생각가지')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')};
$('pdfBtn').onclick=async()=>{ $('menu').classList.remove('open');let c=await exportCanvas();if(!c)return;if(!window.jspdf){alert('PDF 모듈을 불러오지 못했어요.');return}let {jsPDF}=window.jspdf,land=c.width>=c.height,pdf=new jsPDF({orientation:land?'landscape':'portrait',unit:'px',format:[c.width,c.height]});pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,c.width,c.height);pdf.save((node('root')?.text||'생각가지')+'.pdf')};

$('moreBtn').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('open')};document.addEventListener('click',e=>{if(!$('menu').contains(e.target)&&e.target!==$('moreBtn'))$('menu').classList.remove('open')});
$('toggleCredits').onclick=()=>{showCredits=!showCredits;save();render();$('menu').classList.remove('open')};
$('centerBtn').onclick=$('fitBtn').onclick=()=>{center();$('menu').classList.remove('open')};
$('deleteBtn').onclick=()=>{let n=node(selectedId);if(!n||n.root){alert('중심 노드는 삭제할 수 없어요.');return}if(!confirm('선택한 노드와 하위 가지를 삭제할까요?'))return;let ids=new Set([n.id]),changed=true;while(changed){changed=false;data.nodes.forEach(x=>{if(x.parent&&ids.has(x.parent)&&!ids.has(x.id)){ids.add(x.id);changed=true}})}data.nodes=data.nodes.filter(x=>!ids.has(x.id));selectedId='root';save();render();$('menu').classList.remove('open')};
$('newMap').onclick=()=>{if(confirm('새 마인드맵을 시작할까요? 현재 맵은 지워집니다.')){data=fresh();showCredits=true;selectedId='root';save();render();center()}};
function validMap(o){return o&&Array.isArray(o.nodes)&&o.nodes.every(n=>n&&typeof n.id==='string'&&typeof n.text==='string')}
$('saveMapBtn').onclick=async()=>{let payload={...data,fileFormat:'saenggakgaji-mindmap',fileVersion:2,savedAt:new Date().toISOString()},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),title=(node('root')?.text||'생각가지').replace(/[\/:*?"<>|]/g,'-').slice(0,40)+'.mindmap.json';try{if(window.showSaveFilePicker){let h=await showSaveFilePicker({suggestedName:title,types:[{description:'생각가지 마인드맵',accept:{'application/json':['.json']}}]});let w=await h.createWritable();await w.write(blob);await w.close()}else{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=title;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}}catch(e){if(e.name!=='AbortError')alert('파일을 저장하지 못했어요.')} $('menu').classList.remove('open')};
$('openMapBtn').onclick=()=>{$('mapInput').value='';$('mapInput').click();$('menu').classList.remove('open')};
$('mapInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(!validMap(o))throw Error();data=o;showCredits=data.showCredits!==false;positionLocked=!!data.positionLocked;selectedId=node('root')?'root':data.nodes[0].id;lastSnapshot=JSON.stringify(data);undoStack=[lastSnapshot];redoStack=[];save();render();center()}catch(err){alert('생각가지 마인드맵 파일을 읽을 수 없어요.')}};r.readAsText(f)};
$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='생각가지-백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);$('menu').classList.remove('open')};
$('importBtn').onclick=()=>$('backupInput').click();
$('backupInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);showCredits=data.showCredits!==false;selectedId=data.nodes[0]?.id||'root';save();render();center()}catch(err){alert('백업 파일을 읽을 수 없어요.')}};r.readAsText(f)};
render();

// v2.2: register the versioned service worker so GitHub Pages refreshes cached app files.
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=2.3').then(r=>r.update()).catch(()=>{}));
}
</script>
</body></html>
