<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각가지 캐시 초기화</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;padding:40px;line-height:1.7;background:#f6f4ee;color:#30352f}button{padding:12px 18px;border:0;border-radius:12px;background:#58715f;color:#fff;font-size:16px}</style><h2>생각가지 캐시 초기화</h2><p>아래 버튼을 누르면 이 사이트의 Service Worker와 캐시를 지운 뒤 최신 화면으로 이동합니다. 마인드맵의 로컬 저장 데이터는 삭제하지 않습니다.</p><button id="clear">캐시 지우고 최신 버전 열기</button><script>document.getElementById('clear').onclick=async()=>{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}location.href='./index.html?refresh='+Date.now()}</script></html>
