<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각가지 캐시 정리</title></head><body style="font-family:-apple-system,sans-serif;padding:32px;line-height:1.7"><h2>생각가지 캐시 정리</h2><p id="msg">캐시를 정리하고 있어요…</p><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}document.getElementById('msg').textContent='캐시 정리 완료! 메인 화면을 다시 열어 주세요.'}catch(e){document.getElementById('msg').textContent='자동 정리에 실패했어요. 브라우저를 새로고침해 주세요.'}})();</script></body></html>
