<!doctype html><meta charset=utf-8><title>생각가지 캐시 초기화</title><body style='font-family:sans-serif;padding:30px'><h2>생각가지 캐시 초기화</h2><button onclick='go()'>캐시 지우고 새 버전 열기</button><script>async function go(){for(const k of await caches.keys())await caches.delete(k);for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();location.href='./?v=3.0&fresh='+Date.now()}</script></body>
