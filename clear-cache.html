<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>캐시 초기화</title><body style='font-family:sans-serif;padding:30px'><h2>생각가지 캐시 초기화</h2><p id='m'>처리 중…</p><script>(async()=>{for(const k of await caches.keys())await caches.delete(k);if('serviceWorker'in navigator)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();document.getElementById('m').textContent='완료했어요. 생각가지 페이지로 돌아가 새로고침해 주세요.'})()</script>
