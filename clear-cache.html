<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각가지 캐시 초기화</title><body style="font-family:sans-serif;padding:30px;line-height:1.7"><h2>생각가지 캐시 초기화</h2><p id="m">캐시를 정리하고 있어요…</p><script>(async()=>{try{for(const k of await caches.keys())await caches.delete(k);if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}m.textContent='완료되었습니다. 생각가지 페이지로 돌아가 새로고침해 주세요.'}catch(e){m.textContent='캐시 정리 중 오류가 났어요. Safari를 완전히 닫았다가 다시 열어 주세요.'}})()</script></body></html>
