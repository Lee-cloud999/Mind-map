<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생각가지 캐시 초기화</title><body style="font-family:-apple-system,sans-serif;padding:32px;line-height:1.7"><h2>생각가지 캐시 초기화</h2><p id="msg">캐시를 정리하는 중입니다…</p><script>(async()=>{try{for(const k of await caches.keys())await caches.delete(k);if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}document.getElementById('msg').textContent='캐시를 정리했습니다. 생각가지 페이지로 돌아가 새로고침해 주세요.'}catch(e){document.getElementById('msg').textContent='캐시 정리 중 오류가 발생했습니다: '+e.message}})();</script></body>
